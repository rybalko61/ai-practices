<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fa">
  <title>Шпаргалка к презентации · AI в продуктовом дизайне</title>
  <style>
    :root { font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; color: #17293b; background: #f5f7fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, a { font: inherit; }
    button { cursor: pointer; }
    a { color: #285fd7; }
    :focus-visible { outline: 3px solid #285fd7; outline-offset: 3px; }
    .app { min-height: 100svh; display: grid; grid-template-columns: 252px minmax(0, 1fr); }
    .sidebar { position: sticky; top: 0; height: 100svh; overflow: auto; background: #17293b; color: #f5f7fa; padding: 25px 16px 24px; }
    .brand { padding: 0 12px 22px; border-bottom: 1px solid #456075; }
    .brand small { color: #91b1f8; text-transform: uppercase; letter-spacing: .12em; font: 700 11px/1.4 ui-monospace, SFMono-Regular, monospace; }
    .brand h1 { font-size: 23px; line-height: 1.12; letter-spacing: -.04em; margin: 11px 0 8px; }
    .brand p { color: #aabac9; font-size: 13px; line-height: 1.45; margin: 0; }
    .slide-list { display: grid; gap: 4px; padding-top: 16px; }
    .slide-link { width: 100%; border: 0; background: transparent; color: #d5e0e9; display: grid; grid-template-columns: 29px 1fr; align-items: start; gap: 8px; padding: 10px 12px; text-align: left; border-radius: 6px; font-size: 13px; line-height: 1.25; }
    .slide-link span { color: #8caafa; font: 700 11px/1.4 ui-monospace, SFMono-Regular, monospace; }
    .slide-link:hover { background: #29435a; }
    .slide-link[aria-current="true"] { background: #285fd7; color: white; font-weight: 700; }
    .slide-link[aria-current="true"] span { color: white; }
    .main { min-width: 0; padding: 31px clamp(28px, 5vw, 84px) 35px; display: flex; flex-direction: column; }
    .topline { display: flex; justify-content: space-between; gap: 18px; align-items: center; color: #637487; border-bottom: 1px solid #ccd6df; padding-bottom: 18px; font-size: 14px; }
    .topline b { color: #285fd7; font: 700 13px ui-monospace, SFMono-Regular, monospace; }
    .topline a { white-space: nowrap; }
    .note { width: min(100%, 940px); margin: auto 0; padding: 25px 0 18px; }
    .kicker { display: flex; gap: 12px; align-items: center; color: #285fd7; text-transform: uppercase; letter-spacing: .1em; font: 700 12px ui-monospace, SFMono-Regular, monospace; }
    .time { color: #64778b; background: #e8edf3; padding: 6px 9px; border-radius: 4px; letter-spacing: 0; }
    h2 { font-size: clamp(35px, 3.6vw, 54px); line-height: 1.05; letter-spacing: -.055em; margin: 15px 0 22px; }
    .say-label, .cue-label { display: block; color: #66798c; font: 700 12px ui-monospace, SFMono-Regular, monospace; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 11px; }
    .say { font-size: clamp(21px, 2.1vw, 29px); line-height: 1.38; letter-spacing: -.025em; margin: 0 0 22px; }
    .points { list-style: none; padding: 0; margin: 0; display: grid; gap: 11px; }
    .points li { display: grid; grid-template-columns: 18px 1fr; gap: 13px; font-size: clamp(18px, 1.45vw, 22px); line-height: 1.38; }
    .points li::before { content: "→"; color: #285fd7; font-weight: 700; }
    .caution { margin-top: 21px; border-left: 4px solid #285fd7; padding: 8px 0 8px 17px; color: #4f6173; font-size: 17px; line-height: 1.42; }
    .caution b { color: #17293b; }
    .transition { width: min(100%, 940px); border-top: 1px solid #ccd6df; padding-top: 15px; color: #4e6175; font-size: 17px; line-height: 1.4; }
    .transition p { margin: 0; }
    .controls { display: flex; justify-content: space-between; gap: 12px; margin-top: 17px; }
    .controls button { border: 1px solid #b6c6d4; background: #fff; color: #17293b; border-radius: 6px; padding: 12px 18px; font-weight: 700; min-height: 48px; }
    .controls button:hover { border-color: #285fd7; color: #285fd7; }
    .controls button:disabled { opacity: .35; cursor: default; }
    @media (max-width: 760px) {
      .app { display: block; }
      .sidebar { position: static; height: auto; padding: 16px; }
      .brand { padding: 0 4px 10px; }
      .brand h1 { font-size: 20px; margin: 4px 0; }
      .brand p { display: none; }
      .slide-list { display: flex; gap: 5px; overflow-x: auto; padding: 10px 0 0; }
      .slide-link { flex: none; width: 92px; display: block; min-height: 52px; padding: 6px 8px; font-size: 10px; }
      .slide-link span { display: block; }
      .main { min-height: calc(100svh - 155px); padding: 18px 20px 24px; }
      .topline { font-size: 12px; }
      .note { padding: 26px 0; }
      h2 { font-size: 35px; margin-bottom: 23px; }
      .say { font-size: 21px; }
      .points li { font-size: 18px; }
      .caution, .transition { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><small>AI / DESIGN WORKFLOWS</small><h1>Шпаргалка выступления</h1><p>16 слайдов · примерно 20–25 минут<br>← / → — перелистывать</p></div>
      <nav id="slideList" class="slide-list" aria-label="Слайды"></nav>
    </aside>
    <main class="main">
      <div class="topline"><b id="counter">01 / 16</b><a id="presentationLink" href="../" target="_blank" rel="noopener noreferrer">Открыть слайд ↗</a></div>
      <article class="note" aria-live="polite">
        <div class="kicker"><span id="slideNumber">Слайд 01</span><span id="duration" class="time"></span></div>
        <h2 id="title"></h2>
        <span class="say-label">Что сказать</span>
        <p id="say" class="say"></p>
        <ul id="points" class="points"></ul>
        <div id="caution" class="caution" hidden></div>
      </article>
      <div class="transition"><span class="cue-label">Переход</span><p id="transition"></p></div>
      <div class="controls"><button id="previous" type="button">← Назад</button><button id="next" type="button">Дальше →</button></div>
    </main>
  </div>

        say: 'Я бы оценивал не AI-инструменты сами по себе, а конкретные этапы работы и качество результата на наших задачах.',
        points: [
          'Для исследования — взять один реальный бриф и сравнить планы и вопросы; для интервью — измерить время до сверенных цитат.',
          'Для синтеза и поиска — требовать перехода к первоисточнику и смотреть, насколько легко найти актуальный ответ.',
          'Для сценариев и прототипов — проверить покрытие ролей, ошибок и состояний и время до рабочего ревью.',
          'После этого уже можно решить, какие процессы дают нам пользу и какие ограничения нужно снять.'
        ],
        transition: 'И последнее — какой общий вывод я вынес из этих кейсов.'
      },
      {
        title: 'Общий вывод', duration: '≈ 45 секунд',
        say: 'Нейросети не заменяют дизайнеров. Они добавляют нам возможности на отдельных этапах работы.',
        points: [
          'AI помогает быстрее собрать материал, увидеть больше вариантов и показать поведение до разработки.',
          'Но поставить правильный вопрос, понять контекст, проверить источник и принять решение всё равно должна команда.',
          'Для нас следующий шаг — проверить эти процессы на собственных задачах и посмотреть, где результат действительно становится лучше.'
        ],
        transition: 'Дальше можно обсудить, какие из шести процессов чаще всего тормозят нашу работу сейчас.'
      }
    ];

    const pad = n => String(n).padStart(2, '0');
    const list = document.getElementById('slideList');
    list.innerHTML = notes.map((note, i) => `<button class="slide-link" type="button" data-slide="${i}"><span>${pad(i+1)}</span>${note.title}</button>`).join('');
    let index = Math.max(0, Math.min(notes.length - 1, (Number((location.hash.match(/slide-(\d+)/) || [])[1]) || 1) - 1));
    function render() {
      const note = notes[index];
      document.getElementById('counter').textContent = `${pad(index+1)} / ${notes.length}`;
      document.getElementById('slideNumber').textContent = `Слайд ${pad(index+1)}`;
      document.getElementById('duration').textContent = note.duration;
      document.getElementById('title').textContent = note.title;
      document.getElementById('say').textContent = note.say;
      const points = document.getElementById('points');
      points.replaceChildren(...note.points.map(point => { const li = document.createElement('li'); li.textContent = point; return li; }));
      const caution = document.getElementById('caution');
      caution.hidden = !note.caution;
      caution.textContent = note.caution ? `Важно: ${note.caution}` : '';
      document.getElementById('transition').textContent = note.transition;
      document.getElementById('presentationLink').href = `../#slide-${index+1}`;
      document.getElementById('previous').disabled = index === 0;
      document.getElementById('next').disabled = index === notes.length - 1;
      list.querySelectorAll('.slide-link').forEach((button, i) => button.setAttribute('aria-current', String(i === index)));
      history.replaceState(null, '', `#slide-${index+1}`);
    }
    function setSlide(next) { index = Math.max(0, Math.min(notes.length - 1, next)); render(); }
    list.addEventListener('click', event => { const button = event.target.closest('[data-slide]'); if (button) setSlide(Number(button.dataset.slide)); });
    document.getElementById('previous').addEventListener('click', () => setSlide(index-1));
    document.getElementById('next').addEventListener('click', () => setSlide(index+1));
    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowRight' || event.key === 'PageDown') { event.preventDefault(); setSlide(index+1); }
      else if (event.key === 'ArrowLeft' || event.key === 'PageUp') { event.preventDefault(); setSlide(index-1); }
    });
    addEventListener('hashchange', () => { const match = location.hash.match(/slide-(\d+)/); if (match) setSlide(Number(match[1])-1); });
    render();
  </script>
</body>
</html>
